<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Notes Portal - Tablero</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Tablero de notas</span>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span id="userInfo" class="navbar-text"></span>
        <button id="logoutBtn" type="button" class="btn btn-outline-light btn-sm">
          Cerrar sesión
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-3">
      <button id="newNoteBtn" type="button" class="btn btn-primary">
        Nueva nota
      </button>
      <button id="adminUsersBtn" type="button" class="btn btn-outline-secondary d-none">
        Administrar usuarios
      </button>
      <div id="boardLoading" class="text-muted d-none">Cargando notas...</div>
    </div>

    <div id="boardError" class="alert alert-danger d-none" role="alert"></div>

    <section id="metrics" class="row g-3 mb-3" aria-label="Métricas del tablero">
      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">Total de notas</h6>
            <p class="h4 mb-0" id="metricTotal">—</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">Pendientes</h6>
            <p class="h4 mb-0" id="metricPending">—</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">En progreso</h6>
            <p class="h4 mb-0" id="metricInProgress">—</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">Completadas</h6>
            <p class="h4 mb-0" id="metricDone">—</p>
          </div>
        </div>
      </div>
    </section>

    <div id="metricsError" class="alert alert-warning d-none" role="alert"></div>

    <div id="emptyNotes" class="alert alert-info d-none" role="alert">
      No hay notas todavía. Crea la primera con "Nueva nota".
    </div>

    <div id="board" class="board"></div>

    <section id="usersSection" class="d-none mt-4" aria-label="Administración de usuarios">
      <div class="d-flex align-items-center gap-3 mb-3">
        <h2 class="h5 mb-0">Administración de usuarios</h2>
        <button id="createUserBtn" type="button" class="btn btn-primary btn-sm ms-auto">
          Crear usuario
        </button>
      </div>

      <div id="usersMessage" class="alert d-none" role="alert"></div>

      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div
    class="modal fade"
    id="createNoteModal"
    tabindex="-1"
    aria-labelledby="createNoteModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createNoteModalLabel">Nueva nota</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>
        </div>
        <form id="createNoteForm" novalidate>
          <div class="modal-body">
            <div id="createError" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
              <label for="noteTitle" class="form-label">Título</label>
              <input type="text" class="form-control" id="noteTitle" required />
            </div>
            <div class="mb-3">
              <label for="noteContent" class="form-label">Contenido</label>
              <textarea class="form-control" id="noteContent" rows="4" required></textarea>
            </div>
            <div class="mb-3">
              <label for="noteStatus" class="form-label">Estado</label>
              <select class="form-select" id="noteStatus">
                <option value="PENDING" selected>PENDING</option>
                <option value="IN_PROGRESS">IN_PROGRESS</option>
                <option value="DONE">DONE</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">Crear nota</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div
    class="modal fade"
    id="userModal"
    tabindex="-1"
    aria-labelledby="userModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalLabel">Crear usuario</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>
        </div>
        <form id="userForm" novalidate>
          <div class="modal-body">
            <div id="userFormError" class="alert alert-danger d-none" role="alert"></div>
            <div class="mb-3">
              <label for="userName" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="userName" required />
            </div>
            <div class="mb-3">
              <label for="userEmail" class="form-label">Correo</label>
              <input type="email" class="form-control" id="userEmail" required />
            </div>
            <div class="mb-3" id="userPasswordWrap">
              <label for="userPassword" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="userPassword" />
            </div>
            <div class="mb-3">
              <label for="userRole" class="form-label">Rol</label>
              <select class="form-select" id="userRole">
                <option value="USER" selected>USER</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
